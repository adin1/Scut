name: SCUT - Firebase App Distribution CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build Web App & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔨 Build Production Assets
        run: npm run build

      - name: 📝 Generate Release Notes
        id: release_notes
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          AUTHOR=$(git log -1 --pretty=%an)
          echo "notes=Lansare SCUT actualizată de $AUTHOR. Modificări: $COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy / Distribute to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ] && [ -n "$FIREBASE_APP_ID" ]; then
            npx firebase-tools appdistribution:distribute dist --app "$FIREBASE_APP_ID" --token "$FIREBASE_TOKEN" --groups "internal-testers" --release-notes "${{ steps.release_notes.outputs.notes }}"
          else
            echo "ℹ️ Secretele FIREBASE_TOKEN și FIREBASE_APP_ID vor fi utilizate automat odată configurate în Settings > Secrets."
          fi
